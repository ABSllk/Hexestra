name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.name }} quality gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-24.04
          - name: macOS Intel
            os: macos-15-intel
          - name: macOS Apple Silicon
            os: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit public boundary
        run: npm run audit:public

      - name: Type-check, test, and build
        run: npm run check

      - name: Desktop startup smoke (Linux)
        if: matrix.os == 'ubuntu-24.04'
        shell: bash
        run: xvfb-run -a npm run test:startup

      - name: Desktop startup smoke
        if: matrix.os != 'ubuntu-24.04'
        run: npm run test:startup

      - name: Package desktop application
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        run: npm run electron:build -- --publish never

      - name: Upload desktop package
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: Hexestra-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
          if-no-files-found: error
